  if (prev[g] === -2) { return null; }
  var pts = [];
  for (c = g; c !== -1; c = prev[c]) { a = c % CW; pts.unshift([a * 2 + 0.5, (c - a) / CW * 2 + 0.5]); }
  pts.shift(); pts.push([tx, ty]);
  return pts;
}
function solA(x, y) {
  var c = Math.floor(x / 2) + Math.floor(y / 2) * CW;
  var h = cht[c]; if (h < 1) { h = fl[I(Math.round(x), Math.round(y))]; }
  return h < 1 ? 1 : h;
}

/* ================= TEMPS ================= */
var params = {};
location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (m, k, v) { params[k] = decodeURIComponent(v); });
var vitIdx = 0, ancreReel = Date.now(), ancreVirt = Date.now();
if (params.h) { var dh = new Date(); dh.setHours(parseFloat(params.h), (parseFloat(params.h) % 1) * 60, 0, 0); ancreVirt = dh.getTime(); }
if (params.v) { var vv = VITESSES.indexOf(parseInt(params.v, 10)); if (vv >= 0) { vitIdx = vv; } }
function maintenant() { return ancreVirt + (Date.now() - ancreReel) * VITESSES[vitIdx]; }
function heure(t) { var d = new Date(t); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
var btn = document.getElementById('vit');
btn.textContent = 'x' + VITESSES[vitIdx];
btn.onclick = function () {
  ancreVirt = maintenant(); ancreReel = Date.now();
  vitIdx = (vitIdx + 1) % VITESSES.length;
  btn.textContent = 'x' + VITESSES[vitIdx];
};

/* ================= METEO REELLE ================= */
var meteo = { pluie: false, nuages: 0, temp: null };
function chargerMeteo() {
  var x = new XMLHttpRequest();
  x.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + VILLE.lat + '&longitude=' + VILLE.lon + '&current=temperature_2m,precipitation,weather_code,cloud_cover&timezone=Europe%2FParis', true);
  x.onload = function () {
    try {
      var c = JSON.parse(x.responseText).current, w = c.weather_code;
      meteo.pluie = c.precipitation > 0 || (w >= 51 && w <= 67) || (w >= 80 && w <= 82) || w >= 95;
      meteo.nuages = (c.cloud_cover || 0) / 100; meteo.temp = Math.round(c.temperature_2m);
    } catch (e) {}
  };
  x.send();
}
if (params.pluie) { meteo.pluie = true; meteo.nuages = 0.9; } else { chargerMeteo(); setInterval(chargerMeteo, 15 * 60000); }

/* ================= PERSONNAGE ================= */
var PEAU = [168, 111, 69], PEAU_C = [198, 140, 94], PEAU_F = [112, 70, 40];
var PULL = [211, 155, 58], PULL_F = [168, 116, 31], PANT = [44, 49, 64], CHAUS = [232, 228, 218], OEIL = [242, 232, 204], PUP = [40, 30, 28];

function sprite(pose, pas, dos) {
  var p = [], r, c, dx, dy, ins, nb;
  function put(cc, rr, col) { p.push([cc, rr, col]); }
  function dansTete(cc, rr) { dx = cc - 3.5; dy = rr - 3.5; return dx * dx + dy * dy <= 16.5; }
  for (r = 0; r < 8; r++) {
    for (c = 0; c < 8; c++) {
      if (!dansTete(c, r)) { continue; }
      nb = dansTete(c - 1, r) && dansTete(c + 1, r) && dansTete(c, r - 1) && dansTete(c, r + 1);
      put(c, r, nb ? PEAU : PEAU_F);

  put(2, 1, PEAU_C); put(3, 1, PEAU_C); put(2, 2, PEAU_C);
  if (!dos) {
    put(1, 3, OEIL); put(2, 3, OEIL); put(1, 4, OEIL); put(2, 4, PUP);
    put(5, 3, OEIL); put(6, 3, OEIL); put(5, 4, PUP); put(6, 4, OEIL);
  }
  put(3, 8, PEAU_F); put(4, 8, PEAU_F);
  for (r = 9; r <= 20; r++) { for (c = 2; c <= 5; c++) { put(c, r, c === 5 ? PULL_F : PULL); } }
  for (r = 9; r <= 18; r++) { put(1, r, PULL_F); put(6, r, PULL_F); }
  put(1, 19, PEAU); put(1, 20, PEAU); put(6, 19, PEAU); put(6, 20, PEAU);
  if (pose === 'sit') {
    for (c = 1; c <= 6; c++) { put(c, 21, PANT); put(c, 22, PANT); }
    return { px: p, h: 23 };
  }
  for (r = 21; r <= 34; r++) {
    var g = (pas && r >= 28) ? -1 : 0, d = (pas && r >= 28) ? 1 : 0;
    put(2 + g, r, PANT); put(3 + g, r, PANT); put(4 + d, r, PANT); put(5 + d, r, PANT);
  }
  var g2 = pas ? -1 : 0, d2 = pas ? 1 : 0;
  put(2 + g2, 35, CHAUS); put(3 + g2, 35, CHAUS); put(4 + d2, 35, CHAUS); put(5 + d2, 35, CHAUS);
  put(1 + g2, 36, CHAUS); put(2 + g2, 36, CHAUS); put(3 + g2, 36, CHAUS); put(4 + d2, 36, CHAUS); put(5 + d2, 36, CHAUS); put(6 + d2, 36, CHAUS);
  if (pose === 'guitar') {
    for (r = 15; r <= 20; r++) { for (c = 0; c <= 5; c++) { put(c, r, (r === 15 || r === 20 || c === 0 || c === 5) ? [70, 34, 20] : [214, 140, 40]); } }
    put(6, 14, [52, 36, 26]); put(7, 13, [52, 36, 26]); put(8, 12, [52, 36, 26]); put(9, 11, [52, 36, 26]); put(10, 10, [30, 24, 20]);
  }
  return { px: p, h: 37 };
}
var SPR = {};
function getSpr(pose, pas, dos) {
  var k = pose + (pas ? 1 : 0) + (dos ? 'd' : 'f');
  if (!SPR[k]) {
    var s = sprite(pose, pas, dos), j;
    for (j = 0; j < s.px.length; j++) { s.px[j][2] = pack(s.px[j][2][0], s.px[j][2][1], s.px[j][2][2]); }
    SPR[k] = s;
  }
  return SPR[k];
}

var ACTS = {
  canape:   { ax: 22, ay: 46, sx: 22, sy: 52, sz: 11, pose: 'sit', dos: true },
  table:    { ax: 16, ay: 35, sx: 15, sy: 28, sz: 12, pose: 'sit', dos: true },
  guitare:  { ax: 14, ay: 8, pose: 'guitar', dos: false },
  cheminee: { ax: 25, ay: 10, pose: 'stand', dos: true },
  plantes:  { ax: 6, ay: 9, pose: 'stand', dos: true },
  cuisine:  { ax: 66, ay: 9, pose: 'stand', dos: true, vapeur: true },
  fenetre:  { ax: 45, ay: 30, pose: 'stand', dos: false },
  lit:      { ax: 156, ay: 36, pose: 'sleep' }
};
function hasard(t) { return t[Math.floor(Math.random() * t.length)]; }
function choisir(h) {
  if (h >= 1 && h < 7) { return 'lit'; }
  if (h >= 7 && h < 8.5) { return 'cuisine'; }
  if (h >= 12 && h < 13.5) { return hasard(['cuisine', 'table']); }
  if (h >= 19 && h < 20.5) { return hasard(['cuisine', 'cuisine', 'table']); }
  if (h >= 20.5 || h < 1) { return hasard(['canape', 'canape', 'canape', 'guitare', 'cheminee']); }
  return hasard(['table', 'table', 'canape', 'plantes', 'guitare', 'cheminee', 'fenetre', 'cuisine']);
}
var P = { x: 66, y: 16, z: 1, pose: 'stand', dos: false, chemin: null, act: null, fin: 0, pas: 0 };
function lancer(nom) {
  var a = ACTS[nom], prev = P.act ? ACTS[P.act] : null;
  if (prev && (prev.sx !== undefined || prev.pose === 'sleep')) { P.x = prev.ax; P.y = prev.ay; }
  P.act = nom; P.pose = 'walk';
  P.chemin = chemin(P.x, P.y, a.ax, a.ay);
  if (!P.chemin) { P.x = a.ax; P.y = a.ay; arriver(); }
}
function arriver() {
  var a = ACTS[P.act];
  P.chemin = null; P.pose = a.pose; P.dos = !!a.dos;
  if (a.sx !== undefined) { P.x = a.sx; P.y = a.sy; }
  P.fin = maintenant() + (20 + Math.random() * 50) * 60000;
}
function majPerso(t, dt) {
  var h = heure(t), voulu = choisir(h);
  if (P.pose !== 'walk') {
    if ((voulu === 'lit') !== (P.act === 'lit') || t > P.fin) { lancer(voulu === P.act && voulu !== 'lit' ? choisir(h) : voulu); }
    return;
  }
  var v = 7 * (VITESSES[vitIdx] > 1 ? 3 : 1) * dt, cible, dx, dy, d;
  while (v > 0 && P.chemin && P.chemin.length) {
    cible = P.chemin[0]; dx = cible[0] - P.x; dy = cible[1] - P.y; d = Math.sqrt(dx * dx + dy * dy);
    if (d <= v) { P.x = cible[0]; P.y = cible[1]; P.chemin.shift(); v -= d; }
    else { P.x += dx / d * v; P.y += dy / d * v; P.dos = (dx + dy) < 0; v = 0; }
  }
  P.pas += dt * 6;
  if (!P.chemin || !P.chemin.length) { arriver(); }
}

/* ================= DESSIN PAR IMAGE ================= */
function blend(i, col, a) {
  var o = frame[i], r = o & 255, g = (o >> 8) & 255, b = (o >> 16) & 255;
  frame[i] = pack(r + (col[0] - r) * a, g + (col[1] - g) * a, b + (col[2] - b) * a);
}
var persoX = 200;
function dessinerPerso() {
  var a = ACTS[P.act] || {};
  if (P.pose === 'sleep') {
    var hp = proj(175, 45, 8); persoX = hp[0]; var hx = Math.round(hp[0]) - 4, hy = Math.round(hp[1]) - 7, s = getSpr('stand', false, true), j, e, x, y;
    for (j = 0; j < s.px.length; j++) {
      e = s.px[j]; if (e[1] > 7) { continue; }
      x = hx + e[0]; y = hy + e[1]; if (x >= 0 && y >= 0 && x < W && y < H) { frame[x + y * W] = e[2]; }
    }
    return;
  }
  var z = (P.pose === 'sit') ? a.sz : solA(P.x, P.y);
  var pp = proj(P.x, P.y, z); persoX = pp[0]; var pas = P.pose === 'walk' && (Math.floor(P.pas) % 2 === 1);
  var sp = getSpr(P.pose === 'walk' ? 'stand' : P.pose, pas, P.dos);
  var ox = Math.round(pp[0]) - 4, oy = Math.round(pp[1]) - sp.h + 1 - (P.pose === 'stand' && Math.floor(Date.now() / 900) % 2 ? 1 : 0);
  var cle = Math.floor(P.x) + Math.floor(P.y) + 1, k, ee, xx, yy, ii;
  for (k = 0; k < sp.px.length; k++) {
    ee = sp.px[k]; xx = ox + ee[0]; yy = oy + ee[1];
    if (xx < 0 || yy < 0 || xx >= W || yy >= H) { continue; }
    ii = xx + yy * W;
    if (depth[ii] > cle) { continue; }
    frame[ii] = ee[2];
  }
}

var particules = [];
function particulesMaj(dt) {
  var j, p, k, x, y;
  for (j = particules.length - 1; j >= 0; j--) {
    p = particules[j]; p.y -= p.vy * dt; p.x += Math.sin((p.y + p.s) / 3) * 0.15; p.vie -= dt;
    if (p.vie <= 0) { particules.splice(j, 1); continue; }
    x = Math.round(p.x); y = Math.round(p.y);
    if (p.z) {
      var G = ['1111', '0010', '0100', '1111'];
      for (k = 0; k < 16; k++) { if (G[k >> 2].charAt(k & 3) === '1' && x + (k & 3) < W && y + (k >> 2) < H && y > 0) { blend(x + (k & 3) + (y + (k >> 2)) * W, [235, 235, 255], Math.min(1, p.vie)); } }
    } else if (x >= 0 && y >= 0 && x < W && y < H) {
      blend(x + y * W, [250, 250, 250], 0.6 * Math.min(1, p.vie));
    }
  }
}

/* ================= LUMIERE ================= */
function lerpTable(tab, h) {
  var j, a, b, f;
  for (j = 0; j < tab.length - 1; j++) {
    a = tab[j]; b = tab[j + 1];
    if (h >= a[0] && h <= b[0]) { f = (h - a[0]) / (b[0] - a[0]); return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3] + (b[3] - a[3]) * f]; }
  }
  return [tab[0][1], tab[0][2], tab[0][3]];
}
var CIEL = [[0, 12, 16, 40], [5.5, 22, 26, 58], [7, 231, 162, 122], [8.5, 160, 198, 230], [17, 168, 203, 228], [19, 229, 138, 92], [20.5, 39, 48, 90], [24, 12, 16, 40]];
var AMB = [[0, 92, 98, 148], [5.5, 100, 104, 150], [7.5, 236, 214, 200], [9, 255, 252, 246], [17, 255, 250, 240], [19, 226, 176, 146], [21, 120, 114, 160], [24, 92, 98, 148]];
function lueur(x, y, z, r, col, a) {
  var p = proj(x, y, z), g = cx.createRadialGradient(p[0], p[1], 0, p[0], p[1], r);
  g.addColorStop(0, 'rgba(' + col + ',' + a + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
  cx.fillStyle = g; cx.fillRect(p[0] - r, p[1] - r, r * 2, r * 2);
}

/* ================= BOUCLE ================= */
var dernier = Date.now(), tvScene = 0, tvChange = 0;
var TV_PAL = [[[60, 110, 200], [230, 120, 80], [40, 60, 120], [240, 220, 180]], [[30, 140, 90], [200, 230, 120], [20, 60, 40], [250, 250, 250]], [[180, 40, 60], [250, 180, 60], [60, 20, 40], [230, 230, 240]]];
function tick() {
  var now = Date.now(), dt = Math.min(0.3, (now - dernier) / 1000); dernier = now;
  var t = maintenant(), h = heure(t), j;
  if (!P.act) { lancer(choisir(h)); }
  majPerso(t, dt);
  frame.set(base);

  // fenetre : ciel, etoiles, pluie
  var ciel = lerpTable(CIEL, h), gris = meteo.nuages * 0.5;
  var cr = ciel[0] + (110 - ciel[0]) * gris * (h > 8 && h < 18 ? 1 : 0.3), cg = ciel[1] + (116 - ciel[1]) * gris * (h > 8 && h < 18 ? 1 : 0.3), cb = ciel[2] + (124 - ciel[2]) * gris * (h > 8 && h < 18 ? 1 : 0.3);
  var nuit = h < 6 || h > 20.5, goutte = Math.floor(now / 60);
  for (j = 0; j < winPx.length; j++) {
    var ip = winPx[j], wx = ip % W, wy = (ip - wx) / W, col = pack(cr + (wy % 7) * 0.6, cg + (wy % 7) * 0.6, cb);
    if (nuit && !meteo.pluie && hs(wx, wy, 5) % 97 === 0 && (hs(wx, wy, now >> 11) % 5)) { col = pack(240, 240, 220); }
    if (meteo.pluie && (wy + goutte + (hs(wx, 0, 3) % 30)) % 11 === 0) { col = pack(cr + 55, cg + 55, cb + 60); }
    frame[ip] = col;
  }

  // TV
  var a = ACTS[P.act] || {}, eveille = P.act !== 'lit' || P.pose === 'walk';
  var tvOn = P.act === 'canape' && P.pose === 'sit' && (h >= 18 || h < 2);
  if (tvOn) {
    if (now > tvChange) { tvScene = (tvScene + 1) % TV_PAL.length; tvChange = now + 2500 + Math.random() * 4000; }
    var pal = TV_PAL[tvScene], fl2 = 0.85 + Math.random() * 0.15;
    for (j = 0; j < tvPx.length; j++) {
      var tp = tvPx[j], ty = (tp - tp % W) / W, cc = pal[((ty >> 1) + (tp % W >> 2)) % pal.length];
      frame[tp] = pack(cc[0] * fl2, cc[1] * fl2, cc[2] * fl2);
    }
  }

  dessinerPerso();

  // vapeur de cuisine et Zz
  if (P.act === 'cuisine' && P.pose !== 'walk' && Math.random() < 0.5) {
    var vp = proj(61 + Math.random() * 2, 4, 12); particules.push({ x: vp[0], y: vp[1], vy: 6, vie: 1.6, s: Math.random() * 9 });
  }
  if (P.act === 'lit' && P.pose === 'sleep' && Math.random() < 0.03) {
    var zp = proj(175, 45, 12); particules.push({ x: zp[0] + 4, y: zp[1] - 6, vy: 4, vie: 2.5, s: Math.random() * 9, z: true });
  }
  particulesMaj(dt);
  cx.putImageData(img, 0, 0);

  // ambiance + lampes
  var amb = lerpTable(AMB, h), lampes = eveille && (h >= 17 || h < 6.5);
  if (meteo.pluie && h > 8 && h < 18) { amb = [amb[0] * 0.86, amb[1] * 0.88, amb[2] * 0.95]; }
  cx.globalCompositeOperation = 'multiply';
  cx.fillStyle = 'rgb(' + (amb[0] | 0) + ',' + (amb[1] | 0) + ',' + (amb[2] | 0) + ')';
  cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  if (h > 8 && h < 18) { lueur(8, 30, 6, 70, '255,236,190', meteo.pluie ? 0.08 : 0.16); }
  if (lampes) {
    var fli = 0.95 + Math.random() * 0.05;
    lueur(35, 7, 25, 60, '255,190,110', 0.34 * fli);
    lueur(2, 53, 14, 46, '255,140,60', 0.36 * fli);
    lueur(7, 4, 12, 26, '255,210,140', 0.22);
    lueur(31, 4, 19, 10 + Math.random() * 3, '255,170,80', 0.5);
    if (P.act === 'cuisine') { lueur(66, 12, 24, 60, '255,230,170', 0.3); }
  }
  if (tvOn) { lueur(43, 9, 17, 46, '110,150,255', 0.16 + Math.random() * 0.08); }
  if (P.act === 'lit' && P.pose === 'walk' && (h >= 21 || h < 7)) { lueur(137, 51, 12, 30, '255,220,140', 0.3); }
  cx.globalCompositeOperation = 'source-over';
  camera();

  var d = new Date(t), hh = d.getHours(), mm = d.getMinutes();
  document.getElementById('hud').textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm +
    (meteo.temp !== null ? '  ·  ' + meteo.temp + '°' : '') + (meteo.pluie ? '  ·  pluie' : '');
}

/* ================= TAILLE ECRAN ================= */
var echelle = 1, portrait = false;
function ajuster() {
  var iw = window.innerWidth, ih = window.innerHeight, s;
  portrait = iw < ih;
  if (portrait) { s = ih / H; }                       // iPhone : la vue remplit la hauteur, la camera suit le perso
  else {
    s = Math.min(iw / W, ih / H);
    if (s >= 1) { s = Math.floor(s * 2) / 2; if (s >= 2) { s = Math.floor(s); } }
  }
  echelle = s;
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
  cv.style.top = Math.round((ih - H * s) / 2) + 'px';
  camera();
}
function camera() {
  var iw = window.innerWidth, l;
  if (!portrait) { l = (iw - W * echelle) / 2; }
  else { l = iw / 2 - persoX * echelle; l = Math.max(iw - W * echelle, Math.min(0, l)); }
  cv.style.left = Math.round(l) + 'px';
}
window.addEventListener('resize', ajuster);
ajuster();
tick();
setInterval(tick, 1000 / FPS);
})();
