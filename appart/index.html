/* Mon appart en pixel art — v0.2 (ES5 pour iPad mini 2 / iOS 12).

(function () {

/* ================= TEMPS ================= */

  coloc: { lit: 'lit_coloc', dort: [0.5, 8.5], libre: ['canape', 'table', 'cuisine', 'cheminee', 'plantes'],

var PERSOS = [];

}
PERSOS.push(nouveauPerso('simon', 'cuisine'));
if (existe('lit_coloc')) { PERSOS.push(nouveauPerso('coloc', 'table')); }
var P = PERSOS[0];
function estAuLit(P) { return P.act === ROUTINES[P.id].lit; }

/* ================= LUMIERE ================= */

/* ================= BOUCLE ================= */

  var now = Date.now(), dt = Math.min(0.3, (now - dernier) / 1000); dernier = now;
  var t = maintenant(), h = heure(t), j;
  for (j = 0; j < PERSOS.length; j++) { majPerso(PERSOS[j], t, dt); }
  frame.set(base);

  // fenetre : ciel, etoiles, pluie
  var ciel = lerpTable(CIEL, h), gris = meteo.nuages * 0.5;
  var cr = ciel[0] + (110 - ciel[0]) * gris * (h > 8 && h < 18 ? 1 : 0.3), cg = ciel[1] + (116 - ciel[1]) * gris * (h > 8 && h < 18 ? 1 : 0.3), cb = ciel[2] + (124 - ciel[2]) * gris * (h > 8 && h < 18 ? 1 : 0.3);
  var nuit = h < 6 || h > 20.5, goutte = Math.floor(now / 60);
  for (j = 0; j < winPx.length; j++) {
    var ip = winPx[j], wx = ip % W, wy = (ip - wx) / W, col = pack(cr + (wy % 7) * 0.6, cg + (wy % 7) * 0.6, cb);
    var vg = M.winVeg ? M.winVeg[j] : 0;
    if (vg) {
      var VG = VEG[vg], jour = Math.max(0.35, Math.min(1, (ciel[0] + ciel[1] + ciel[2]) / 520)), bouge = (vg < 4 && hs(wx >> 1, wy >> 1, (now / 1400) | 0) % 9 === 0) ? 14 : 0;
      col = pack(VG[0] * jour + bouge, VG[1] * jour + bouge, VG[2] * jour);
    }
    else if (nuit && !meteo.pluie && hs(wx, wy, 5) % 97 === 0 && (hs(wx, wy, now >> 11) % 5)) { col = pack(240, 240, 220); }
    if (meteo.pluie && (wy + goutte + (hs(wx, 0, 3) % 30)) % 11 === 0) { col = pack(cr + 55, cg + 55, cb + 60); }
    frame[ip] = col;
  }

  // TV
  var eveille = quelquUn(function (Q) { return !estAuLit(Q) || Q.pose === 'walk'; });
  var tvOn = quelquUn(function (Q) { return Q.act === 'canape' && Q.pose === 'sit'; }) && (h >= 18 || h < 2);
  if (tvOn) {
    if (now > tvChange) { tvScene = (tvScene + 1) % TV_PAL.length; tvChange = now + 2500 + Math.random() * 4000; }
    var pal = TV_PAL[tvScene], fl2 = 0.85 + Math.random() * 0.15;
    for (j = 0; j < tvPx.length; j++) {
      var tp = tvPx[j], ty = (tp - tp % W) / W, cc = pal[((ty >> 1) + (tp % W >> 2)) % pal.length];
      frame[tp] = pack(cc[0] * fl2, cc[1] * fl2, cc[2] * fl2);
    }
  }

  var ordre = PERSOS.slice().sort(function (A1, B1) { return (A1.x + A1.y) - (B1.x + B1.y); });
  for (j = 0; j < ordre.length; j++) { dessinerPerso(ordre[j]); }
  persoX = PERSOS[0].ecranX; persoY = PERSOS[0].ecranY;

  // vapeur de cuisine et Zz
  if (M.vapeur && quelquUn(function (Q) { return Q.act === 'cuisine' && Q.pose !== 'walk'; }) && Math.random() < 0.5) {
    var vp = proj(M.vapeur.x + Math.random() * 2, M.vapeur.y, M.vapeur.z + 1); particules.push({ x: vp[0], y: vp[1], vy: 6, vie: 1.6, s: Math.random() * 9 });
  }
  for (var zi = 0; zi < PERSOS.length; zi++) {
    var Q = PERSOS[zi], AQ = ACTS[Q.act];
    if (Q.pose === 'sleep' && AQ && Math.random() < 0.03) { var zp = proj(AQ.tx, AQ.ty, AQ.tz + 4); particules.push({ x: zp[0] + 4, y: zp[1] - 6, vy: 4, vie: 2.5, s: Math.random() * 9, z: true }); }
  }
  particulesMaj(dt);
  cx.putImageData(img, 0, 0);

  // ambiance + lampes
  var amb = lerpTable(AMB, h), lampes = eveille && (h >= 17 || h < 6.5);
  if (meteo.pluie && h > 8 && h < 18) { amb = [amb[0] * 0.86, amb[1] * 0.88, amb[2] * 0.95]; }
  cx.globalCompositeOperation = 'multiply';
  cx.fillStyle = 'rgb(' + (amb[0] | 0) + ',' + (amb[1] | 0) + ',' + (amb[2] | 0) + ')';
  cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  var jl, L;
  if (h > 8 && h < 18) { for (jl = 0; jl < M.jours.length; jl++) { L = M.jours[jl]; lueur(L.x, L.y, L.z, 60, '255,236,190', meteo.pluie ? 0.07 : 0.14); } }
  var fli = 0.95 + Math.random() * 0.05;
  for (jl = 0; jl < M.lumieres.length; jl++) {
    L = M.lumieres[jl];
    if (L.type === 'tv') { if (tvOn) { lueur(L.x, L.y, L.z, 46, '110,150,255', 0.16 + Math.random() * 0.08); } continue; }
    if (!lampes) { continue; }
    if (L.type === 'lampadaire') { lueur(L.x, L.y, L.z, 60, '255,190,110', 0.34 * fli); }
    else if (L.type === 'lampe_orange') { lueur(L.x, L.y, L.z, 46, '255,140,60', 0.36 * fli); }
    else if (L.type === 'lampe') { lueur(L.x, L.y, L.z, 34, '255,210,140', 0.26 * fli); }
    else if (L.type === 'bougie') { lueur(L.x, L.y, L.z, 10 + Math.random() * 3, '255,170,80', 0.5); }
    else if (L.type === 'cuisine' && quelquUn(function (Q) { return Q.act === 'cuisine'; })) { lueur(L.x, L.y, L.z, 60, '255,230,170', 0.3); }
  }
  cx.globalCompositeOperation = 'source-over';
  camera();

  var d = new Date(t), hh = d.getHours(), mm = d.getMinutes();
  document.getElementById('hud').textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm +
    (meteo.temp !== null ? '  ·  ' + meteo.temp + '°' : '') + (meteo.pluie ? '  ·  pluie' : '');
}

/* ================= TAILLE ECRAN ================= */
var echelle = 1, portrait = false, zoom = 1;
try { zoom = parseFloat(localStorage.getItem('appart-zoom')) || 1; } catch (e) {}
function ajuster() {
  var iw = window.innerWidth, ih = window.innerHeight, s;
  portrait = iw < ih;
  if (portrait) { s = ih / H; }
  else { s = Math.min(iw / W, ih / H); if (s >= 1) { s = Math.floor(s * 2) / 2; if (s >= 2) { s = Math.floor(s); } } }
  echelle = s * zoom;
  cv.style.width = Math.round(W * echelle) + 'px'; cv.style.height = Math.round(H * echelle) + 'px';
  camera();
}
function camera() {
  var iw = window.innerWidth, ih = window.innerHeight, l, t, cw = W * echelle, chh = H * echelle;
  if (cw <= iw) { l = (iw - cw) / 2; } else { l = Math.max(iw - cw, Math.min(0, iw / 2 - persoX * echelle)); }
  if (chh <= ih) { t = (ih - chh) / 2; } else { t = Math.max(ih - chh, Math.min(0, ih / 2 - persoY * echelle)); }
  cv.style.left = Math.round(l) + 'px'; cv.style.top = Math.round(t) + 'px';
}
function changerZoom(f) {
  zoom = Math.max(1, Math.min(4, zoom * f)); if (zoom < 1.2) { zoom = 1; }
  try { localStorage.setItem('appart-zoom', String(zoom)); } catch (e) {}
  ajuster();
}
document.getElementById('zp').onclick = function () { changerZoom(1.5); };
document.getElementById('zm').onclick = function () { changerZoom(1 / 1.5); };
window.addEventListener('resize', ajuster);
ajuster();
tick();
setInterval(tick, 1000 / FPS);
}

/* plan : brouillon local de l'editeur (?local=1), sinon plan.json, sinon plan par defaut */
var params0 = {};
location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (m, k, v) { params0[k] = decodeURIComponent(v); });
var local = null;
if (params0.local) { try { local = JSON.parse(localStorage.getItem('appart-plan')); } catch (e) { local = null; } }
if (local && local.pieces) { demarrer(local); }
else {
  var x = new XMLHttpRequest();
  x.open('GET', 'plan.json?t=' + Date.now(), true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4) { return; }
    var plan = null;
    if (x.status >= 200 && x.status < 300) { try { plan = JSON.parse(x.responseText); } catch (e) { plan = null; } }
    demarrer(plan && plan.pieces ? plan : Moteur.PLAN_DEFAUT);
  };
  x.send();
}
})();
