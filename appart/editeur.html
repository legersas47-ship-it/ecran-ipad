<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur du plan</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #17151c; color: #e9e6ef; font: 14px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid #2c2935; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0 14px 0 0; }
  button, select, input { font: inherit; color: inherit; }
  button { background: #2a2733; border: 1px solid #3c3847; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #343040; }
  button.on { background: #e0a040; color: #1b1406; border-color: #e0a040; }
  button.prim { background: #3f7be0; border-color: #3f7be0; color: #fff; }
  .sep { width: 1px; height: 24px; background: #3c3847; margin: 0 4px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px 18px; }
  .zone { background: #1e1b25; border: 1px solid #2c2935; border-radius: 12px; padding: 12px; min-width: 0; }
  .zone h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8d879b; margin: 0 0 8px; font-weight: 600; }
  #plan { display: block; width: 100%; cursor: default; background: #121016; border-radius: 8px; touch-action: none; }
  #apercu { display: block; width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; background: #16141b; border-radius: 8px; }
  label { display: block; margin: 8px 0 3px; color: #a7a1b5; font-size: 12px; }
  input[type=text], input[type=number], select { width: 100%; background: #14121a; border: 1px solid #3c3847; border-radius: 7px; padding: 6px 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ouv { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #2c2935; font-size: 13px; }
  .ouv button { padding: 2px 8px; font-size: 12px; }
  .aide { color: #8d879b; font-size: 12px; margin-top: 8px; }
  #msg { color: #7fd39a; font-size: 13px; margin-left: auto; }
  textarea { width: 100%; height: 120px; background: #14121a; color: #cfc9dc; border: 1px solid #3c3847; border-radius: 7px; font: 11px/1.3 Consolas, monospace; margin-top: 8px; display: none; }
  .vide { color: #8d879b; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Éditeur du plan</h1>
  <button data-outil="select" class="on">Sélection</button>
  <button data-outil="porte">+ Porte</button>
  <button data-outil="fenetre">+ Fenêtre</button>
  <button data-outil="gomme">Gomme</button>
  <span class="sep"></span>
  <button data-outil="n_rect">✎ Cadre</button>
  <button data-outil="n_trait">✎ Dessin</button>
  <button data-outil="n_texte">✎ Texte</button>
  <span class="sep"></span>
  <button id="ajout">+ Pièce</button>
  <select id="ajoutObj" style="width:auto;padding:7px 10px;border-radius:8px"><option value="">+ Objet…</option></select>
  <button id="voirNotes">Annotations : visibles</button>
  <button id="annuler">Annuler</button>
  <button id="reinit">Réinitialiser</button>
  <span class="sep"></span>
  <button id="grand">Voir en grand</button>
  <button id="copier" class="prim">Copier le plan</button>
  <span id="msg"></span>
</header>
<main>
  <div>
    <div class="zone"><h2>Plan vu de dessus · 1 case = 1 m</h2><canvas id="plan"></canvas>
      <div class="aide" id="aideOutil">Clique une pièce ou un meuble pour le choisir. Glisse-le pour le déplacer, tire un bord pour l'agrandir, ou utilise les flèches du clavier.</div>
    </div>
    <div class="zone" style="margin-top:16px"><h2>Aperçu pixel art (se met à jour tout seul)</h2><canvas id="apercu"></canvas></div>
  </div>
  <div class="zone" id="panneau"></div>
</main>
<script src="moteur.js"></script>
<script>

/* ---------- chargement ---------- */

  try { brouillon = JSON.parse(localStorage.getItem('appart-plan')); } catch (e) {}
  chargerOriginal(function (publie) {

    cb(p && p.pieces ? p : clone(Moteur.PLAN_DEFAUT));

/* ---------- plan 2D ---------- */

var ROSE = '#ff5fa2', notePrev = null;

  var t = JSON.stringify(plan);
  var ta = document.getElementById('sortie');
  function montrer() { if (ta) { ta.style.display = 'block'; ta.value = t; ta.select(); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { msg('Plan copié : colle-le à Claude dans le chat'); }, function () { montrer(); msg('Copie le texte ci-dessous'); });
  } else { montrer(); msg('Copie le texte ci-dessous'); }
  if (sel >= 0) { sel = -1; afficherPanneau(); dessinerPlan(); setTimeout(function () { var x = document.getElementById('sortie'); if (x) { x.style.display = 'block'; x.value = t; } }, 0); }
};
document.addEventListener('keydown', function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') {
    var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key], k2 = e.shiftKey ? 5 : 1;
    if (d && (selObj >= 0 || sel >= 0)) {
      e.preventDefault(); memo();
      if (selObj >= 0) { var o = plan.objets[selObj]; deplacerObjet(o, d[0] * k2, d[1] * k2, clone(o)); }
      else { var p = plan.pieces[sel]; p.x0 += d[0] * k2; p.x1 += d[0] * k2; p.y0 += d[1] * k2; p.y1 += d[1] * k2; if (p.x0 < 0 || p.y0 < 0) { histo.length && (plan = JSON.parse(histo.pop())); } }
      change(); return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selObj >= 0) { e.preventDefault(); memo(); plan.objets.splice(selObj, 1); selObj = -1; change(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); document.getElementById('annuler').click(); }
});

charger(function (p) { plan = p; dessinerPlan(); afficherPanneau(); apercu(); });
})();
</script>
